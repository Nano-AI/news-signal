# Latency on the burst replay. Both are required metrics declared by benchmark/run.py.
[[objective]]
name = "p99_latency_ms"
direction = "min"

[[objective]]
name = "p50_latency_ms"
direction = "min"

[pareto]
# Set by scripts/freeze_baseline.py: max(0.03, the relative spread of the two baseline p99 runs, rounded up).
relative_noise = 0.03
