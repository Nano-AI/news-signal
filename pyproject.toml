[project]
name = "news-signal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10",
  "numpy>=2.0",
  "pydantic>=2.7",
  "scipy>=1.13",
  "tokenizers>=0.20",
  "torch>=2.9,<2.10",
  "transformers>=4.46",
]

[dependency-groups]
dev = [
  "hypothesis>=6",
  "pytest>=8",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# CPU wheels for development; the cluster environment swaps in ROCm wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
